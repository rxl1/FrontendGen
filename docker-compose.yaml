services:
  mysql:
    image: mysql:8
    container_name: codegen-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: rxl2000
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --sql-mode=NO_ENGINE_SUBSTITUTION
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis-master:
    image: redis:8.6.2
    container_name: codegen-redis-master
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --requirepass rxl2000
      --masterauth rxl2000
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis/master:/data