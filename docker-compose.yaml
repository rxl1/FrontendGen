services:
  mysql:
    image: mysql:8
    container_name: codegen-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: rxl2000
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --sql-mode=NO_ENGINE_SUBSTITUTION
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql

  redis-master:
    image: redis:8.6.2
    container_name: codegen-redis-master
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --requirepass rxl2000
      --masterauth rxl2000
      --appendonly yes
      --appendfsync everysec
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis/master:/data

  nginx:
    image: nginx:latest
    container_name: codegen-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./data/nginx/conf.d:/etc/nginx/conf.d
      - ./data/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./data/nginx/logs:/var/log/nginx
      - ./tmp/code_deploy:/usr/share/nginx/html
    depends_on:
      - mysql
      - redis-master