# 端口及上下文路径配置
server:
  port: 8123
  servlet:
    context-path: /api

# Spring 配置
spring:
  application:
    name: CodeGen
  profiles:
    active: dev
  jackson:
    default-property-inclusion: NON_NULL # JSON处理时忽略非空字段
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# SpringDoc 接口文档
springdoc:
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.renix.codegen.controller

# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 日志配置
logging:
  level:
    com.renix: debug
  pattern:
    dateformat: mm:ss.SSS
